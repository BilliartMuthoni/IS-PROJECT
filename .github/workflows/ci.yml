name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sproutly-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sproutly-backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt ruff
      - name: Lint (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82
      - name: Compile
        run: python -m compileall -q app alembic main.py

  ml:
    name: ML pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: pip install ruff nbformat
      - name: Lint (syntax errors and undefined names)
        run: ruff check . --select E9,F63,F7,F82
      - name: Validate notebooks
        run: |
          python -c "
          import nbformat, pathlib
          for nb in sorted(pathlib.Path('notebooks').glob('*.ipynb')):
              nbformat.validate(nbformat.read(nb, as_version=4))
              print('valid', nb)
          "

  mobile:
    name: Mobile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sproutly-mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sproutly-mobile/package-lock.json
      - name: Install dependencies
        run: npm ci
